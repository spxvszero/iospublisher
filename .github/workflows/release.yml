name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Validate release tag
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build release assets
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          rm -rf dist release
          mkdir -p dist release

          build_target() {
            local goos="$1"
            local goarch="$2"
            local goarm="$3"
            local platform="$4"
            local binary_name="iospublisher"
            local out_dir="dist/iospublisher-${platform}"
            local archive_base="iospublisher-${tag}-${platform}"

            if [[ "$goos" == "windows" ]]; then
              binary_name="iospublisher.exe"
            fi

            mkdir -p "$out_dir"
            cp README.md "$out_dir/README.md"
            cp config.json.example "$out_dir/config.json"

            local -a env_args=("GOOS=$goos" "GOARCH=$goarch" "CGO_ENABLED=0")
            if [[ -n "$goarm" ]]; then
              env_args+=("GOARM=$goarm")
            fi

            env "${env_args[@]}" go build -trimpath -ldflags="-s -w" -o "$out_dir/$binary_name" ./cmd/iospublisher

            if [[ "$goos" == "windows" ]]; then
              (cd dist && zip -qr "../release/${archive_base}.zip" "iospublisher-${platform}")
            else
              tar -C dist -czf "release/${archive_base}.tar.gz" "iospublisher-${platform}"
            fi
          }

          build_target linux amd64 "" linux-amd64
          build_target linux arm64 "" linux-arm64
          build_target linux arm 7 linux-armv7
          build_target windows amd64 "" windows-amd64
          build_target darwin amd64 "" darwin-amd64
          build_target darwin arm64 "" darwin-arm64

          (cd release && sha256sum * > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_args=(--verify-tag --fail-on-no-commits --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          assets=(release/*.tar.gz release/*.zip release/checksums.txt)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}"
