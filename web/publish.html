<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iOS 发布</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body data-page="publish">
    <header class="topbar">
      <div class="brand">iOS Publisher</div>
      <nav>
        <a href="/internal">管理</a>
      </nav>
    </header>

    <main class="page">
      <div id="publishList" class="publish-list"></div>

      <section class="publish-empty" id="publishEmpty" hidden>
        <div>
          <div class="status-line">未发布</div>
          <h2>当前无可用安装包</h2>
          <p class="muted">管理员完成 IPA 上传并生成安装配置后，这里会显示安装入口。</p>
        </div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
